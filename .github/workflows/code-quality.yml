name: Code quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --no-pub
      - name: Run tests
        run: flutter test --no-pub
      - name: Check formatting of reviewed files
        run: dart format --output=none --set-exit-if-changed lib/home_screen.dart lib/splash_screen.dart test/home_screen_test.dart
