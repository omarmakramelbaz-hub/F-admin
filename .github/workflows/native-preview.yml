name: Native store validation

on:
  push:
    branches: [codex/f-admin-webview-20261111]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-store-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the direct web dashboard wrapper
        run: node web-preview/test-direct.cjs
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package the approved original GO icon
        run: |
          python -m pip install --disable-pip-version-check Pillow==13.0.0
          python -m unittest discover -s test -p 'test_generate_app_icons.py'
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install the declared Android SDK components
        run: |
          android_sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$android_sdk_manager"
          "$android_sdk_manager" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build the signed release app bundle
        run: flutter build appbundle --release --no-pub
      - name: Validate the signed store bundle
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --silent --show-error --location --max-time 120 --output "$bundletool_jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$bundletool_jar" | sha256sum --check --status
          bundle_paths=(build/app/outputs/bundle/release/*.aab)
          test "${#bundle_paths[@]}" -eq 1
          bundle="${bundle_paths[0]}"
          test -f "$bundle"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$bundle" > "$RUNNER_TEMP/aab-signature-verification.txt"
          grep -qx 'jar verified.' "$RUNNER_TEMP/aab-signature-verification.txt"
          keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile "$bundle" | python -c 'import re, sys; matches = re.findall(r"(?m)^\s*SHA256:\s*((?:[0-9A-F]{2}:){31}[0-9A-F]{2})\s*$", sys.stdin.read()); assert matches, "Cannot identify the AAB signer certificate SHA-256"; print("AAB upload signer certificate SHA-256: " + matches[0])'
          java -jar "$bundletool_jar" validate --bundle="$bundle"
          java -jar "$bundletool_jar" dump manifest --bundle="$bundle" --module=base > "$RUNNER_TEMP/aab-manifest.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'aab-manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          if manifest.attrib.get('package') != 'com.smartvision.fasakhainista_dashboard':
              raise SystemExit('Store bundle package does not match the existing app.')
          sdk = manifest.find('uses-sdk')
          if sdk is None or sdk.attrib.get(android + 'targetSdkVersion') != '36':
              raise SystemExit('Store bundle must target Android API 36.')
          print('Signed AAB verified: com.smartvision.fasakhainista_dashboard; target API 36; version '
                + str(manifest.attrib.get(android + 'versionName')) + ' ('
                + str(manifest.attrib.get(android + 'versionCode')) + ').')
          PY
      - name: Upload validated store app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fasakhansta-dashboard-store-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package the approved original GO icon
        run: |
          python -m pip install --disable-pip-version-check Pillow==13.0.0
          python scripts/generate_app_icons.py
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile iOS without signing
        run: flutter build ios --simulator --debug --no-pub
