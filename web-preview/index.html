<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7a00">
  <title>Fasakhansta Dashboard</title>
  <style>
    :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; color: #28313a; background: #fff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    .app { display: grid; grid-template-rows: calc(10px + env(safe-area-inset-top, 0px)) minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .brand-bar { background: linear-gradient(100deg, #ff9800, #ff6d00); }
    .viewport { position: relative; min-width: 0; min-height: 0; padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .loading { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; overflow: auto; padding: 28px 22px; background: #fff; text-align: center; }
    .loading[hidden], [hidden] { display: none !important; }
    .loading-card { width: min(100%, 360px); }
    .spinner { width: 38px; height: 38px; margin: 0 auto 20px; border: 3px solid #ffe7ce; border-top-color: #f47713; border-radius: 50%; animation: spin .85s linear infinite; }
    h1 { margin: 0 0 12px; font-size: 21px; line-height: 1.6; font-weight: 700; }
    .message { margin: 0; color: #64707c; font-size: 16px; line-height: 1.8; }
    .actions { display: flex; flex-direction: column; align-items: stretch; gap: 12px; margin-top: 24px; }
    .retry, .fallback { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 11px 18px; border: 1px solid transparent; border-radius: 12px; text-decoration: none; font-size: 16px; line-height: 1.5; font-weight: 700; }
    .retry { color: #fff; background: #dd6200; }
    .retry:hover { background: #c45600; }
    .fallback { border-color: #e1e5e8; color: #35414b; background: #fff; }
    .fallback:hover { background: #faf7f3; }
    .direct-link { position: fixed; top: -200px; inset-inline-start: 12px; z-index: 3; padding: 12px 16px; border-radius: 8px; color: #fff; background: #29323b; font-size: 16px; text-decoration: none; }
    .direct-link:focus { top: calc(18px + env(safe-area-inset-top, 0px)); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body data-release="f-admin-webview-20261111">
  <a class="direct-link" href="/admin/login" target="_top">فتح لوحة التحكم مباشرة</a>
  <main class="app" aria-label="لوحة تحكم فسخانستا">
    <div class="brand-bar" aria-hidden="true"></div>
    <div class="viewport">
      <iframe id="dashboard" src="/admin/login" title="Fasakhansta Dashboard" allow="camera 'self'; microphone 'self'; geolocation 'self'; clipboard-read 'self'; clipboard-write 'self'" aria-busy="true"></iframe>
      <div class="loading" id="loading">
        <div class="loading-card">
          <div class="spinner" id="spinner" aria-hidden="true"></div>
          <h1 id="heading">لوحة تحكم فسخانستا</h1>
          <p class="message" id="message">جارٍ فتح لوحة التحكم…</p>
          <div class="actions" id="actions" hidden>
            <button class="retry" id="retry" type="button">حاول مرة أخرى</button>
            <a class="fallback" href="/admin/login" target="_top">فتح لوحة التحكم مباشرة</a>
          </div>
        </div>
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite">جارٍ فتح لوحة التحكم</p>
    </div>
  </main>
  <noscript>
    <style>.loading { display: none; }</style>
  </noscript>
  <script>
    (() => {
      'use strict';
      const frame = document.getElementById('dashboard');
      const overlay = document.getElementById('loading');
      const spinner = document.getElementById('spinner');
      const message = document.getElementById('message');
      const actions = document.getElementById('actions');
      const status = document.getElementById('status');
      let timer;
      let hasLoadedOnce = false;

      function loading() {
        window.clearTimeout(timer);
        overlay.hidden = false;
        spinner.hidden = false;
        actions.hidden = true;
        message.textContent = 'جارٍ فتح لوحة التحكم…';
        status.textContent = 'جارٍ فتح لوحة التحكم';
        frame.setAttribute('aria-busy', 'true');
        timer = window.setTimeout(() => failed(true), 20000);
      }

      function failed(timedOut) {
        window.clearTimeout(timer);
        overlay.hidden = false;
        spinner.hidden = true;
        actions.hidden = false;
        message.textContent = timedOut
          ? 'التحميل استغرق وقتًا أطول. يمكنك المحاولة مرة أخرى أو فتح لوحة التحكم مباشرة.'
          : 'تعذّر فتح لوحة التحكم. حاول مرة أخرى أو افتحها مباشرة.';
        status.textContent = message.textContent;
        frame.setAttribute('aria-busy', 'false');
      }

      frame.addEventListener('load', () => {
        if (!hasLoadedOnce) {
          try {
            const page = frame.contentDocument;
            if (!page || page.URL === 'about:blank' ||
                new URL(page.URL).origin !== window.location.origin ||
                !page.body || page.body.childElementCount === 0) {
              failed(false);
              return;
            }
          } catch (_) {
            failed(false);
            return;
          }
          hasLoadedOnce = true;
        }
        window.clearTimeout(timer);
        overlay.hidden = true;
        frame.setAttribute('aria-busy', 'false');
        status.textContent = 'تم فتح لوحة التحكم';
      });
      frame.addEventListener('error', () => failed(false));
      document.getElementById('retry').addEventListener('click', () => {
        hasLoadedOnce = false;
        loading();
        frame.src = '/admin/login';
        frame.focus();
      });
      loading();
    })();
  </script>
</body>
</html>
